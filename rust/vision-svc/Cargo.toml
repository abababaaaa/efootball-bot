[package]
name = "vision-svc"
version = "0.1.0"
edition = "2021"
description = "eFootball bot 的 Rust 视觉 sidecar：DXGI 捕获 + 共享内存帧环 + OCR/YOLO 推理"

[[bin]]
name = "vision-svc"
path = "src/main.rs"

[dependencies]
ort = { version = "2.0.0-rc.15", features = ["load-dynamic", "directml"] }
serde = { version = "1", features = ["derive"] }
png = "0.17"
serde_json = "1"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_WinRT_Direct3D11",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Foundation",
]
