name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      - name: Get version from csproj
        id: get_version
        shell: pwsh
        run: |
          [xml]$xml = Get-Content 'src/EfootballBot/EfootballBot.csproj'
          $v = $xml.Project.PropertyGroup.Version
          Write-Output "version=$v"

      - name: Publish
        run: >
          dotnet publish src/EfootballBot
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=PdbOnly
          -o publish

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath publish\efootball-bot-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: efootball-bot
          path: publish/efootball-bot-win-x64.zip

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: efootball-bot
          path: release-artifact

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifact/efootball-bot-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
