name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 测试门禁：Brain 判定回归（历史上反复出问题的误判都有测试锁定）不得在编译通过的
      # 情况下发版。此前测试只在本地跑，tag 推送直接 publish 发 Release 并被自动更新拉走。
      - name: Test
        run: dotnet test tests/EfootballBot.Tests/EfootballBot.Tests.csproj -c Release --nologo

      - name: Get version from csproj
        id: get_version
        shell: pwsh
        run: |
          [xml]$xml = Get-Content 'src/EfootballBot/EfootballBot.csproj'
          $v = $xml.Project.PropertyGroup.Version
          Write-Output "version=$v"

      - name: Publish
        run: >
          dotnet publish src/EfootballBot
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -o publish

      - name: Create zip
        shell: pwsh
        # zip 仅为 ≤2.0.2 旧版更新器兼容保留（它们只认 .zip 资产）；新更新器直接下裸 exe
        run: Compress-Archive -Path publish\EfootballBot.exe -DestinationPath publish\efootball-bot-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: efootball-bot
          path: |
            publish/EfootballBot.exe
            publish/efootball-bot-win-x64.zip

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: efootball-bot
          path: release-artifact

      # 测试版=4 段数字 tag（v2.0.5.1，迭代递增第 4 段）；带横杠 tag 不可用（更新器 Version.TryParse 解析失败）。
      # with: 表达式不支持 =~ 正则（v2.0.5.1 首发实测：Unexpected symbol '=~'），先在 step 里算好再引用
      - name: Resolve prerelease flag
        id: meta
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $pre = $tag -like '*-*' -or $tag -match '^v\d+\.\d+\.\d+\.\d+$'
          "prerelease=$(if ($pre) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      # Release 正文 = CHANGELOG.md 里对应 tag 的段落（见文件头部格式约定）。
      # 此前只靠 generate_release_notes，正文只有 Full Changelog 链接，用户看不到更新内容。
      # generate_release_notes 保留：自动生成的 notes 追加在自定义正文之后。
      - name: Extract changelog for this tag
        id: changelog
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $text = if (Test-Path CHANGELOG.md) { Get-Content CHANGELOG.md -Raw -Encoding utf8 } else { '' }
          $pattern = '(?ms)^## ' + [regex]::Escape($tag) + '\s*?(.*?)(?=^## v|\z)'
          $m = [regex]::Match($text, $pattern)
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { '' }
          if (-not $body) { Write-Host "WARNING: CHANGELOG.md 里没有 $tag 段落，Release 正文将缺少更新说明" }
          "body<<CHANGELOG_EOF`n$body`nCHANGELOG_EOF" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release-artifact/EfootballBot.exe
            release-artifact/efootball-bot-win-x64.zip
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}

      # ---- 差量更新：对「上一个 Release 的 exe」生成一跳补丁，作为独立资产上传 ----
      # 客户端（UpdateApplier.TryDeltaAsync）优先下 patch-<旧>-to-<新>.bin，产物 SHA256 必须与
      # 整包一致才使用，任何失败自动回退整包下载。实测 119MB→119MB 的版本跳变补丁约 4MB（3.3%）。
      - name: Build delta patch from previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cur = '${{ github.ref_name }}'.TrimStart('v')
          $prevTag = $null
          try {
            $rels = gh release list --limit 20 --json tagName | ConvertFrom-Json
            $prevTag = ($rels | Where-Object { $_.tagName -ne '${{ github.ref_name }}' } | Select-Object -First 1).tagName
          } catch { Write-Host "list releases failed: $_" }
          if (-not $prevTag) { Write-Host '没有上一个 Release，跳过差量补丁'; exit 0 }
          $prev = $prevTag.TrimStart('v')
          Write-Host "prev=$prev cur=$cur"
          New-Item -ItemType Directory -Force prev | Out-Null
          gh release download $prevTag --pattern EfootballBot.exe --dir prev --clobber
          if (-not (Test-Path 'prev/EfootballBot.exe')) {
            Write-Host '上一版没有裸 exe 资产（旧包为 zip），跳过差量补丁'
            exit 0
          }
          $name = "patch-$prev-to-$cur.bin"
          dotnet run --project tools/PatchGen -c Release -- prev/EfootballBot.exe release-artifact/EfootballBot.exe "release-artifact/$name"
          gh release upload '${{ github.ref_name }}' "release-artifact/$name" --clobber
          Write-Host "patch asset uploaded: $name"

      # SHA256 写入 Release 正文：更新器下载完成后按它校验完整性——加速镜像被篡改/反代吐
      # 错误页/发错版本都因哈希不匹配被弃用并切换下一通道。正文经 api.github.com 直读，与
      # 镜像分属不同信任域，不被中间人污染。
      - name: Append SHA256 to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = foreach ($f in 'release-artifact/EfootballBot.exe', 'release-artifact/efootball-bot-win-x64.zip') {
            "SHA256 $(Split-Path -Leaf $f): $((Get-FileHash -Algorithm SHA256 $f).Hash.ToLower())"
          }
          $hdr = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $api = "$env:GITHUB_API_URL/repos/${{ github.repository }}/releases"
          $rel = Invoke-RestMethod -TimeoutSec 40 -Headers $hdr "$api/tags/${{ github.ref_name }}"
          # 重跑幂等：先剥掉旧 SHA256 行再追加（重发布的哈希可能变化）
          $kept = (($rel.body -split "`r?`n") | Where-Object { $_ -notmatch '^SHA256 ' }) -join "`n"
          $body = $kept.TrimEnd() + "`n`n" + ($lines -join "`n")
          Invoke-RestMethod -TimeoutSec 40 -Method Patch -Headers $hdr -Uri "$api/$($rel.id)" `
            -Body (@{ body = $body } | ConvertTo-Json) -ContentType 'application/json'
          Write-Host "SHA256 appended to release $($rel.tag_name)"

      # ---- 国内直连源（Cloudflare R2：免费 10GB、流量免费、免实名，r2.dev 公开桶）----
      # 前提（一次性）：Cloudflare → R2 建桶并启用 r2.dev 公开访问 → 创建 API Token
      # （Object Read & Write），仓库 Secrets：R2_ACCOUNT_ID / R2_ACCESS_KEY_ID /
      # R2_SECRET_ACCESS_KEY / R2_BUCKET；桶公开地址填入 Updater.R2PublicBaseUrl。
      # 未配置 Secret 时本步自动跳过，客户端走 镜像 → GitHub 直连 候选链。
      # 顺序=先 exe 后清单：清单最后可见，不会出现"新清单配旧 exe"。
      - name: Publish to Cloudflare R2
        # 注意：if: 里不能引用 secrets 上下文（Unrecognized named-value，整个 workflow 解析失败，
        # e9ab974 首发实测 run 59/60 双双 no-jobs failure）——改在脚本内检测，未配置时直接退出
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:AWS_ACCESS_KEY_ID) {
            Write-Host 'R2 secrets not configured, skipping publish (client falls back to mirrors -> GitHub).'
            exit 0
          }
          $exe = 'release-artifact/EfootballBot.exe'
          $manifest = @{
            version = '${{ github.ref_name }}'.TrimStart('v')
            sha256  = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
            size    = (Get-Item $exe).Length
          } | ConvertTo-Json -Compress
          Set-Content -Path latest-pre.json -Value $manifest -Encoding ascii
          aws s3 cp $exe "s3://$env:R2_BUCKET/EfootballBot.exe" --endpoint-url $env:R2_ENDPOINT --content-type application/octet-stream
          aws s3 cp latest-pre.json "s3://$env:R2_BUCKET/latest-pre.json" --endpoint-url $env:R2_ENDPOINT --content-type application/json
          # 正式版才更新 latest.json（测试版用户读 latest-pre.json，两清单独立）
          $tag = '${{ github.ref_name }}'
          if ($tag -notlike '*-*' -and $tag -notmatch '^v\d+\.\d+\.\d+\.\d+$') {
            Set-Content -Path latest.json -Value $manifest -Encoding ascii
            aws s3 cp latest.json "s3://$env:R2_BUCKET/latest.json" --endpoint-url $env:R2_ENDPOINT --content-type application/json
          }
          Write-Host "R2 published: $tag"
